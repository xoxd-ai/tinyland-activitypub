name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run without publishing"
        required: false
        type: boolean
        default: true
permissions:
  actions: read
  contents: read
  packages: read
jobs:
  package:
    uses: xoxd-ai/ci-templates/.github/workflows/js-bazel-package.yml@v3.2.1
    with:
      runner_mode: repo_owned
      runner_labels_json: ${{ vars.PRIMARY_LINUX_RUNNER_LABELS_JSON }}
      workspace_mode: isolated
      node_versions: '["22"]'
      publish_node_version: "22"
      pnpm_version: "10.13.1"
      typecheck_command: pnpm typecheck
      unit_test_command: pnpm test
      build_command: pnpm build
      package_check_command: pnpm check:package
      bazel_targets: "//:pkg //:test //:package_artifact_test"
      package_dir: ./bazel-bin/pkg
      npm_access: public
      npm_publish_mode: disabled
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    # Validation only. No provider publisher runs: npm_publish_mode is
    # disabled and no GitHub Packages name is set, so the template skips both
    # publish jobs (GP2, TIN-89). Releases ship as a GitHub tag/release plus an
    # append-only bazel-registry entry. No secrets are passed on purpose.
