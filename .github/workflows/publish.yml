name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run without publishing"
        required: false
        type: boolean
        default: true
permissions:
  actions: read
  contents: read
  id-token: write
  packages: write
jobs:
  package:
    uses: xoxd-ai/ci-templates/.github/workflows/js-bazel-package.yml@v3.2.1
    with:
      runner_mode: repo_owned
      runner_labels_json: ${{ vars.PRIMARY_LINUX_RUNNER_LABELS_JSON }}
      workspace_mode: isolated
      node_versions: '["22"]'
      publish_node_version: "22"
      pnpm_version: "10.13.1"
      typecheck_command: pnpm typecheck
      unit_test_command: pnpm test
      build_command: pnpm build
      package_check_command: pnpm check:package
      bazel_targets: "//:pkg //:test"
      package_dir: ./bazel-bin/pkg
      npm_access: public
      npm_publish_mode: disabled
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
    # No secrets are passed on purpose. The template publishes to GitHub
    # Packages with the workflow GITHUB_TOKEN when TINYLAND_GITHUB_PACKAGES_TOKEN
    # is absent, and this workflow grants packages: write above. The package
    # scope is the repository owner, which is exactly what GITHUB_TOKEN may
    # write. The org secret stopped authenticating after the org rename
    # (release v0.3.2, run 35559338282: 401 on the PUT).
